[package]
name = "astrocat"
version = "0.0.0" # the bundle version comes from VERSION via scripts/version.py
description = "AstroCat desktop app"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
