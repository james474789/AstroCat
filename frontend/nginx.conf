server {
    listen 8090;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Not in nginx's default mime.types; iOS wants the right type to honour the manifest
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (if needed)
    # ^~ so the static-asset regex above (\.jpg etc.) doesn't capture deep-zoom tiles under /api/
    location ^~ /api/ {
        proxy_pass http://backend:8089/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Online catalog layers (O1) wait on SkyBoT, which can take ~60 s for wide fields
        proxy_read_timeout 120s;
    }
}
