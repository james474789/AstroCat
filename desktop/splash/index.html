<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AstroCat</title>
  <style>
    :root { --bg: #0b0f1a; --fg: #e6e9f2; --muted: #8a93a8; --accent: #7c8cf8; --error: #f87171; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f6f7fb; --fg: #151a2b; --muted: #5b6478; --accent: #4f5bd5; --error: #c0392b; }
    }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 16px; text-align: center; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: .02em; }
    .spinner { width: 28px; height: 28px; border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { color: var(--muted); min-height: 1.5em; }
    #error { display: none; max-width: 560px; color: var(--error); }
    button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--muted); background: transparent; color: var(--fg); cursor: pointer; }
    .failed .spinner { display: none; }
    .failed #error { display: block; }
  </style>
</head>
<body>
  <main id="main">
    <h1>AstroCat</h1>
    <div class="spinner" aria-hidden="true"></div>
    <div id="status" role="status">Starting…</div>
    <div id="error" role="alert">
      <p id="error-message"></p>
      <button id="open-logs" type="button">Open logs folder</button>
    </div>
  </main>
  <script>
    const tauri = window.__TAURI__;
    const main = document.getElementById('main');
    if (tauri) {
      tauri.event.listen('backend-status', (e) => {
        document.getElementById('status').textContent = `${e.payload}…`;
      });
      tauri.event.listen('backend-error', (e) => {
        main.classList.add('failed');
        document.getElementById('status').textContent = 'AstroCat could not start.';
        document.getElementById('error-message').textContent = e.payload;
      });
      document.getElementById('open-logs').addEventListener('click', () => tauri.core.invoke('open_logs'));
    }
  </script>
</body>
</html>
