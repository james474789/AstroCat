[supervisord]
nodaemon=true
logfile=/var/log/astrocat/supervisord.log
logfile_maxbytes=1MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid

[program:uvicorn]
command=/usr/local/bin/uvicorn app.main:app --host 0.0.0.0 --port 8089 --workers %(ENV_UVICORN_WORKERS)s
directory=/app
# user=AstroCat
autostart=true
autorestart=true
stdout_logfile=/var/log/astrocat/uvicorn.stdout.log
stderr_logfile=/var/log/astrocat/uvicorn.stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=5MB

[program:celery_worker]
command=/usr/local/bin/celery -A app.worker worker --loglevel=info --concurrency=%(ENV_CELERY_WORKERS)s -Q indexer,thumbnails,celery
directory=/app
# user=AstroCat
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/astrocat/celery_worker.stdout.log
stderr_logfile=/var/log/astrocat/celery_worker.stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=5MB

# V1: full-resolution pyramid builds get their own worker (and queue), so a big master
# can never stack up on the main pool. The shell supplies the FULLRES_WORKERS default.
[program:celery_fullres]
command=sh -c "exec /usr/local/bin/celery -A app.worker worker --loglevel=info --concurrency=${FULLRES_WORKERS:-1} -Q fullres -n fullres@%%h"
directory=/app
# user=AstroCat
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/astrocat/celery_fullres.stdout.log
stderr_logfile=/var/log/astrocat/celery_fullres.stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=5MB

# Star-metrics measurement loads whole frames as float32 (hundreds of MB each), so it gets its
# own low-concurrency worker. Running it on the main pool OOM-killed the container.
# --max-memory-per-child (KiB) recycles a child that balloons instead of letting it hit the cgroup limit.
[program:celery_quality]
command=sh -c "exec /usr/local/bin/celery -A app.worker worker --loglevel=info --concurrency=${QUALITY_WORKERS:-1} --max-memory-per-child=${QUALITY_MAX_MEM_KB:-900000} -Q quality -n quality@%%h"
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/astrocat/celery_quality.stdout.log
stderr_logfile=/var/log/astrocat/celery_quality.stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=5MB

[program:celery_beat]
command=/usr/local/bin/celery -A app.worker beat --loglevel=info --schedule=/tmp/astrocat/celerybeat-schedule
directory=/app
# user=AstroCat
autostart=true
autorestart=true
stdout_logfile=/var/log/astrocat/celery_beat.stdout.log
stderr_logfile=/var/log/astrocat/celery_beat.stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=5MB
