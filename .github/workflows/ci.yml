# Checks on every push and pull request: backend tests on Linux, Windows and macOS (no database
# needed; they stub Postgres/Redis), a frontend production build, and, when backend or desktop
# code changes, a desktop runtime build + launcher smoke test (D2, docs/desktop-parity.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      SECRET_KEY: ci0only0k9x2Zq7LmP4vB8nR1sT6wY3uH5jC
      DATABASE_URL: postgresql+asyncpg://u:p@localhost/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: libvips (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips42
      - run: pip install -r requirements.txt
      - name: libvips (Windows, macOS)
        # pyvips-binary ships libvips itself; requirements.txt's pyvips loads it
        if: runner.os != 'Linux'
        run: pip install pyvips-binary
      # Turns each failing test into an annotation, readable without signing in to see the logs
      - run: pip install pytest-github-actions-annotate-failures
      - run: python -m pytest tests -q -p no:warnings --tb=short -rf
      - name: Desktop runtime build helpers
        working-directory: desktop/runtime
        run: python -m pytest test_build_runtime.py test_updater_manifest.py -q -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists a PR's files through the API
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'backend/app/**'
              - 'backend/requirements.txt'
              - 'backend/alembic/**'
              - 'desktop/**'
              - '.github/workflows/**'
              - '.github/actions/**'

  # Compile check of the Tauri shell (main.rs, plugins, capabilities): the installer build only
  # runs in release.yml, so without this a Rust error would first show up on release day.
  desktop-shell:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: cargo check
        working-directory: desktop/src-tauri
        run: |
          mkdir -p resources/runtime  # tauri-build wants the bundled resources folder to exist
          cargo check --release

  # The same runtime build + smoke test as release.yml (shared composite action), without the
  # Tauri installer build.
  desktop-smoke:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-runtime
        with:
          os: ${{ matrix.os }}
          smoke: "true"
          redis-zip-url: ${{ vars.WINDOWS_REDIS_ZIP_URL }}
          redis-zip-sha256: ${{ vars.WINDOWS_REDIS_ZIP_SHA256 }}
