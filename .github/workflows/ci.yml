# Checks on every push and pull request: backend tests (no database needed; they stub
# Postgres/Redis) and a frontend production build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci0only0k9x2Zq7LmP4vB8nR1sT6wY3uH5jC
      DATABASE_URL: postgresql+asyncpg://u:p@localhost/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips42
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q -p no:warnings
      - name: Desktop runtime build helpers
        working-directory: desktop/runtime
        run: python -m pytest test_build_runtime.py -q -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
